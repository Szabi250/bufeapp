:root{
  --bg:#eef1fb; --surface:#ffffff; --surface2:#f6f8fe; --ink:#0f1533; --muted:#565e86; --line:rgba(16,26,104,.12); --tint:#e4e9fc;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:15.5px;line-height:1.45;color:var(--ink);
  background:radial-gradient(55% 40% at 100% 0%,rgba(113,144,246,.22),transparent 70%),radial-gradient(50% 40% at 30% 100%,rgba(51,69,156,.18),transparent 70%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
p{margin:0}
.wm{position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
.wm img{width:min(60vw,440px);height:auto;object-fit:contain;opacity:var(--wm-op);filter:var(--wm-filter)}

/* ---------- belépés, kapcsolat ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:min(100%,460px);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.gate-card.wide{width:min(100%,640px)}
.gate-brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.crest{width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.gate-brand h1{font-size:26px;font-weight:800;line-height:1.1}
.gate-brand p{color:var(--muted);font-size:14px}
.gate h2{font-size:20px;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:16px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.input,.select,textarea.input{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);padding:10px 12px;font-size:15.5px}
textarea.input{min-height:160px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5}
.input:focus,.select:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 4px rgba(51,69,156,.16)}
.err{color:var(--red);font-weight:600;font-size:14.5px;margin:0 0 12px}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;color:var(--on-p);background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 4px 12px rgba(16,26,104,.22);white-space:nowrap}
.btn.block{width:100%;min-height:50px;font-size:16px}
.btn.ghost{background:var(--tint);color:var(--ink);box-shadow:none}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--red-bg);color:var(--red);box-shadow:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.linkbtn{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.demo{margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.demo b{color:var(--ink)}
.steps{margin:0 0 16px;padding-left:20px;color:var(--muted)}
.steps li{margin:4px 0}
.steps b{color:var(--ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;background:var(--tint);padding:1px 6px;border-radius:6px}

/* ---------- váz ---------- */
.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;color:#fff;background:linear-gradient(170deg,#101a68 0%,#23338a 60%,#33459c 100%)}
.side .who{display:flex;align-items:center;gap:12px;padding:0 6px 16px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.side .crest{width:48px;height:48px;border-radius:14px}
.side .who b{display:block;font-family:var(--head);font-size:18px;line-height:1.1}
.side .who small{display:block;opacity:.75;font-size:12.5px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:rgba(255,255,255,.82);font-weight:600;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:#101a68}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.14);font-size:13px}
.side .foot .me{opacity:.85}
.side .foot button{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.85);font-weight:600;min-height:38px}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:10px;width:max-content}
.mode.demo-m{background:var(--amber);color:#3a2400}
.mode.live{background:rgba(95,212,160,.2);color:#b9f5d8}
.main{padding:28px 32px 60px;min-width:0}
.page{max-width:1120px;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:30px;font-weight:800;line-height:1.1}
.ph p{color:var(--muted);margin-top:4px}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h2{font-size:19px;margin-bottom:12px}
.panel h2 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>.panel{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--head);font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14px}
.kpi.hl{background:linear-gradient(145deg,var(--p1),var(--p2));color:var(--on-p);border-color:transparent}
.kpi.hl span{color:inherit;opacity:.85}

.check{list-style:none;margin:0;padding:0}
.check li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border:0}
.check .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--muted);font-weight:800;font-size:13px}
.check .done .dot{background:var(--green-bg);color:var(--green)}
.check .t{flex:1}
.check .t b{display:block}
.check .t small{color:var(--muted)}

/* ---------- táblázat ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--p2);background:var(--tint)}
.chip .n{color:var(--muted);font-weight:500;margin-left:4px}
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
tr.off td{color:var(--muted)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--tint);color:var(--link)}
.tag.bufes{background:var(--amber-bg);color:var(--amber-ink)}
.tag.admin{background:var(--p1);color:var(--on-p)}
.tag.off{background:var(--red-bg);color:var(--red)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.empty b{display:block;color:var(--ink);font-family:var(--head);font-size:19px;margin-bottom:6px}
.spinner{width:30px;height:30px;margin:26px auto;border-radius:50%;border:3.5px solid var(--tint);border-top-color:var(--p2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- étlap ---------- */
.cat-h{font-size:16px;margin:14px 0 4px;color:var(--muted);font-family:var(--body);font-weight:700}
.prod{display:grid;grid-template-columns:44px 1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border:0}
.prod .emo{width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:24px}
.prod b{display:block}
.prod small{color:var(--muted)}
.prod .price{font-family:var(--head);font-weight:700;font-size:16px;white-space:nowrap}
.prod.off{opacity:.55}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.brk{display:grid;grid-template-columns:1fr 120px auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.brk:last-child{border:0}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emojis button{width:38px;height:38px;border-radius:10px;background:var(--tint);font-size:20px}
.allerg{display:flex;flex-wrap:wrap;gap:6px}
.allerg label{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:17px;border:1.5px solid var(--line);font-size:14px;cursor:pointer}
.allerg input{accent-color:var(--p2)}
.allerg label:has(input:checked){border-color:var(--p2);background:var(--tint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.inline{display:flex;align-items:center;gap:10px;min-height:44px}

/* ---------- rendelések, statisztika ---------- */
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav .input{width:auto;min-height:40px}
.prep{display:grid;grid-template-columns:36px 1fr 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prep:last-child{border:0}
.prep .bar,.hbar{height:8px;border-radius:4px;background:var(--tint);margin-top:5px;overflow:hidden}
.prep .bar i,.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2))}
.prep b.q{font-family:var(--head);font-size:24px;font-weight:800;text-align:right}
.brk-h{font-size:16px;margin:16px 0 6px;display:flex;justify-content:space-between;gap:8px}
.brk-h small{font-family:var(--body);color:var(--muted);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px;border-bottom:1.5px solid var(--line)}
.bars .b{flex:1;min-width:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--p2),var(--p1));min-height:2px}
.bars .b span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars .b em{font-style:normal;font-size:11.5px;font-weight:700}
.blabels{display:flex;gap:6px;margin-top:6px}
.blabels span{flex:1;min-width:10px;text-align:center;font-size:11.5px;color:var(--muted)}

/* ---------- beállítások ---------- */
.set{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.set:last-of-type{border:0}
.set b{display:block}
.set small{display:block;color:var(--muted);margin-top:2px}
.preview{margin-top:8px;font-size:14px;background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px 12px;font-weight:600}

/* ---------- importálás ---------- */
.stepper-h{display:flex;gap:6px;margin-bottom:16px}
.stepper-h span{flex:1;height:5px;border-radius:3px;background:var(--tint)}
.stepper-h span.on{background:linear-gradient(90deg,var(--p1),var(--p2))}
.mapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.prevtable{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.prevtable table{font-size:13.5px}
.prevtable td,.prevtable th{padding:6px 10px}
.prevtable tr.bad td{background:var(--red-bg);color:var(--red)}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.progress{height:14px;border-radius:7px;background:var(--tint);overflow:hidden;margin:18px 0 8px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .2s}
.note{background:var(--amber-bg);color:var(--amber-ink);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:10px 0}
.warnbox{background:var(--red-bg);color:var(--red);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:10px 0;font-weight:600}
.okbox{background:var(--green-bg);color:var(--green);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:10px 0;font-weight:600}
label.cb{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:10px 0}
label.cb input{margin-top:4px;width:18px;height:18px;accent-color:var(--p2);flex:none}
label.cb small{display:block;color:var(--muted)}

/* ---------- modal ---------- */
.mback{position:fixed;inset:0;z-index:50;background:rgba(8,12,48,.55);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.mdl{width:min(100%,560px);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:22px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mdl.wide{width:min(100%,920px)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mh h2{font-size:22px}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tint);flex:none}
.mf{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.mf .r{display:flex;gap:8px;margin-left:auto}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,160%);z-index:60;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,.3);transition:transform .25s}
.toast{opacity:0;visibility:hidden}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast.bad{background:var(--red);color:#fff}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto}
  .side .who{border:0;padding:0;margin:0}
  .side .who>div:not(.crest),.side .foot .me,.side .foot .mode{display:none}
  .side .crest{width:40px;height:40px}
  .kpi b{font-size:24px}
  .nav{flex-direction:row}
  .nav button{min-height:40px;padding:0 10px;white-space:nowrap}
  .nav button span{display:none}
  .nav button[aria-current="page"] span{display:inline}
  .side .foot{margin:0 0 0 auto;padding:0;border:0;flex-direction:row}
  .side .foot button span{display:none}
  .main{padding:18px 16px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.row2,.row3,.mapgrid{grid-template-columns:1fr}
  .set{grid-template-columns:1fr}
  .ph h1{font-size:25px}
  .prod{grid-template-columns:40px 1fr auto;row-gap:6px}
  .prod .sw,.prod .ed{grid-column:auto}
  .brk{grid-template-columns:1fr 90px}
  .hide-m{display:none}
}
@media print{
  body{background:#fff;color:#000}
  .side,.wm,.noprint,.toast{display:none!important}
  .layout{display:block}
  .main{padding:0}
  .panel{box-shadow:none;border:0;padding:0}
  .kpi{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

/* ---------- apró segédek ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return iso(d); };
const ft = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' Ft';
const MONTHS_S = ['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
const WD = ['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const WD_SUB = ['vasárnapra','hétfőre','keddre','szerdára','csütörtökre','péntekre','szombatra'];
const WD_S = ['V','H','K','Sze','Cs','P','Szo'];
const dayLong = s => { const d = parseDay(s); return `${WD[d.getDay()]}, ${MONTHS_S[d.getMonth()]} ${d.getDate()}.`; };
const todayIso = () => iso(new Date());
const givenName = n => String(n || '').trim().split(/\s+/).slice(-1)[0];
const initials = n => String(n || '').trim().split(/\s+/).map(w => w[0] || '').slice(0,2).join('').toUpperCase();
const maskId = id => String(id).slice(0,4) + '•••' + String(id).slice(-4);
const hhmmToMin = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };

function schoolDays(n = 5, from = new Date()){
  const out = [], d = new Date(from); d.setHours(0,0,0,0);
  while (out.length < n){ const w = d.getDay(); if (w !== 0 && w !== 6) out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}

/* Születési dátum értelmezése sokféle írásmódból: 2007-10-20, 2007.10.20., 2007. 10. 20., 20071020 */
function normBirth(v){
  const d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.length !== 8) return null;
  const y = +d.slice(0,4), m = +d.slice(4,6), day = +d.slice(6,8);
  const t = new Date(y, m-1, day);
  if (y < 1900 || y > 2100 || t.getFullYear() !== y || t.getMonth() !== m-1 || t.getDate() !== day) return null;
  return `${y}-${pad(m)}-${pad(day)}`;
}

/* ---------- tárolás (localStorage, ha nem érhető el: memória) ---------- */
const _mem = {};
const store = {
  get(k, d = null){ try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch(e){} return k in _mem ? _mem[k] : d; },
  set(k, v){ _mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ delete _mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};

/* =====================================================================
   API – ugyanazokat a függvényeket hívja a Supabase-ben, vagy demó
   módban a böngészőben futó utánzatot (Mock).
   ===================================================================== */
const API = {
  remote: !!(BUFE_CONFIG.supabaseUrl && BUFE_CONFIG.supabaseKey),
  url: BUFE_CONFIG.supabaseUrl,
  key: BUFE_CONFIG.supabaseKey,
  configure(url, key){
    this.url = String(url || '').trim().replace(/\/+$/, '');
    this.key = String(key || '').trim();
    this.remote = !!(this.url && this.key);
  },
  async call(fn, args = {}){
    if (!this.remote) return Mock.call(fn, JSON.parse(JSON.stringify(args)));
    const headers = { 'Content-Type': 'application/json', 'apikey': this.key };
    if (this.key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + this.key;
    let res;
    try {
      res = await fetch(`${this.url}/rest/v1/rpc/${fn}`, { method:'POST', headers, body: JSON.stringify(args) });
    } catch (e) {
      const err = new Error('halozat'); err.code = 'halozat'; throw err;
    }
    let body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok){
      const code = body && (body.message || body.error || body.msg) || ('HTTP ' + res.status);
      const err = new Error(code); err.code = code; err.status = res.status; throw err;
    }
    return body;
  }
};

async function call(fn, args = {}){
  try { return await API.call(fn, { p_token: A.token, ...args }); }
  catch (e) {
    if (e.code === 'nincs_belepve' || e.code === 'nincs_jogosultsag'){ logout('A belépésed lejárt. Lépj be újra.'); }

function rangeDates(r){
  const t = new Date(); t.setHours(0,0,0,0);
  const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  if (r === 'week'){ const s = new Date(mon); s.setDate(mon.getDate() + 6); return [iso(mon), iso(s), 'Ez a hét']; }
  if (r === 'last'){ const a = new Date(mon); a.setDate(mon.getDate() - 7); const b = new Date(mon); b.setDate(mon.getDate() - 1); return [iso(a), iso(b), 'Előző hét']; }
  if (r === 'month'){ const a = new Date(t.getFullYear(), t.getMonth(), 1), b = new Date(t.getFullYear(), t.getMonth() + 1, 0); return [iso(a), iso(b), 'Ez a hónap']; }
  const a = new Date(t); a.setDate(t.getDate() - 29); return [iso(a), iso(t), 'Elmúlt 30 nap'];
}

  if (!A.fixedConn){ const c = store.get(CONNKEY, null); if (c && c.url && c.key) API.configure(c.url, c.key); }
  if (LIVE_BUILD && !API.remote){ A.view = 'connect'; A.err = ''; render(); return; }
  const tok = sess.get();
  if (tok){
    try {
      const d = await API.call('app_adatok', { p_token: tok });
      if (d.felhasznalo.szerep === 'admin'){ A.token = tok; A.user = d.felhasznalo; A.view = 'main'; render(); return goto(A.page); }
    } catch (e) {}
    sess.del();
  }
  try {
    const r = await API.call('admin_van_admin', {});
    A.view = r.van ? 'login' : 'first';
  } catch (e) {
    A.view = 'connect'; A.err = 'Nem sikerült elérni az adatbázist: ' + hibaSzoveg(e);
  }
  render();
}

  enter(r.token, r.felhasznalo);

async function goto(page){

  if (page === 'home') return pageHome();

function parseTable(text){
  text = String(text || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  const first = text.split('\n')[0];
  const delim = first.includes('\t') ? '\t' : (first.split(';').length >= first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQ){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else inQ = false; } else cell += ch; continue; }
    if (ch === '"' && cell === '') inQ = true;
    else if (ch === delim){ row.push(cell.trim()); cell = ''; }
    else if (ch === '\n'){ row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  row.push(cell.trim()); rows.push(row);
  return rows.filter(r => r.some(c => c !== ''));
}
function guessMap(header){
  const m = { azonosito:-1, nev:-1, vezetek:-1, kereszt:-1, osztaly:-1, szuletes:-1 };
  header.forEach((h, i) => {
    const s = h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (m.azonosito < 0 && /(oktatasi|azonosito|om\b|diakigazolvany)/.test(s)) m.azonosito = i;
    else if (m.szuletes < 0 && /szulet|szul\.|birth/.test(s)) m.szuletes = i;
    else if (m.osztaly < 0 && /osztaly|class|csoport/.test(s)) m.osztaly = i;
    else if (m.vezetek < 0 && /vezetek/.test(s)) m.vezetek = i;
    else if (m.kereszt < 0 && /kereszt|uto/.test(s)) m.kereszt = i;
    else if (m.nev < 0 && /nev|name/.test(s)) m.nev = i;
  });
  return m;
}
function excelDate(v){
  const s = String(v).trim();
  if (/^\d{5}(\.\d+)?$/.test(s)){ const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  return normBirth(s);
}
function analyse(){
  const I = A.imp, rows = I.rows, m = I.map;
  const body = I.hasHeader ? rows.slice(1) : rows;
  const seen = new Set();
  I.items = body.map((r, i) => {
    const sor = i + (I.hasHeader ? 2 : 1);
    const az = String(r[m.azonosito] || '').replace(/\D/g, '');
    const nev = m.nev >= 0 ? String(r[m.nev] || '').trim() : [r[m.vezetek], r[m.kereszt]].filter(Boolean).join(' ').trim();
    const osztaly = m.osztaly >= 0 ? String(r[m.osztaly] || '').trim() : '';
    const sz = m.szuletes >= 0 ? excelDate(r[m.szuletes] || '') : null;
    let hiba = '';
    if (az.length !== 11) hiba = 'Az azonosító nem 11 számjegy';
    else if (!nev) hiba = 'Hiányzik a név';
    else if (!sz) hiba = 'Hibás születési dátum';
    else if (seen.has(az)) hiba = 'Kétszer szerepel a listában';
    if (!hiba) seen.add(az);
    return { sor, azonosito:az, nev, osztaly, szuletes:sz, hiba };
  });
}

async function runImport(){
  const I = A.imp, good = I.items.filter(x => !x.hiba);
  I.step = 3; I.done = null; renderImport();
  const res = { uj:0, frissitett:0, inaktivalt:0, hibak: I.items.filter(x => x.hiba).map(x => ({ sor:x.sor, hiba:x.hiba })) };
  try {
    for (let i = 0; i < good.length; i += CHUNK){
      const part = good.slice(i, i + CHUNK).map(x => ({ sor:x.sor, azonosito:x.azonosito, nev:x.nev, osztaly:x.osztaly, szuletes:x.szuletes }));
      const r = await call('admin_diakok_feltoltes', { p_lista:part });
      res.uj += r.uj; res.frissitett += r.frissitett; res.hibak.push(...r.hibak);
      const p = $('#imp-prog'); if (p) p.style.width = Math.round(Math.min(i + CHUNK, good.length) / good.length * 100) + '%';
      const st = $('#imp-status'); if (st) st.textContent = `Feltöltés folyamatban… ${Math.min(i + CHUNK, good.length)} / ${good.length}`;
    }
    if (I.inaktival){ const r = await call('admin_diakok_inaktival', { p_megmarad: good.map(x => x.azonosito) }); res.inaktivalt = r.inaktivalt; }
    res.hibak.sort((a, b) => a.sor - b.sor);
    I.done = res; renderImport();
  } catch (e) {
    I.step = 2; renderImport(); $('#merr').textContent = 'A feltöltés megszakadt: ' + hibaSzoveg(e) + ` (${res.uj + res.frissitett} sor már bekerült, nyugodtan indítsd újra).`;
  }
}

let lastFocus = null;
function openModal(title, body, wide){
  const inner = `<div class="mdl${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button class="x" data-act="close-modal" aria-label="Bezárás">${ic('x', 18)}</button></div>${body}</div>`;
  const back = $('#modal .mback');
  if (back) back.innerHTML = inner;
  else { lastFocus = document.activeElement; $('#modal').innerHTML = `<div class="mback" data-act="mback">${inner}</div>`; }
  const f = $('#modal input:not([readonly]):not([type=checkbox]), #modal textarea'); (f || $('#modal .x')).focus();
}
function closeModal(){ $('#modal').innerHTML = ''; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} }
function confirmBox(text, okLabel, onOk){
  const back = $('#modal').innerHTML;
  const host = $('#modal .mf') || $('#modal .mdl');
  const box = document.createElement('div');
  box.className = 'warnbox'; box.innerHTML = `${esc(text)}<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn sm ghost" data-c="no">Mégsem</button><button type="button" class="btn sm danger" data-c="yes">${esc(okLabel)}</button></div>`;
  host.replaceWith(box);
  box.addEventListener('click', ev => { const c = ev.target.closest('[data-c]'); if (!c) return; ev.stopPropagation(); if (c.dataset.c === 'yes') onOk(); else $('#modal').innerHTML = back; });
}

      if (I.hasHeader && I.map.azonosito < 0 && I.map.nev < 0){ I.hasHeader = false; I.map = { azonosito:0, nev:1, vezetek:-1, kereszt:-1, osztaly:2, szuletes:3 }; }

    }
    case 'imp-back': A.imp.step = 1; renderImport(); break;
    case 'imp-go': A.imp.inaktival = $('#imp-inakt').checked;

      const on = el.getAttribute('aria-checked') !== 'true';
      el.setAttribute('aria-checked', on); el.closest('.prod').classList.toggle('off', !on);
      try { await call('admin_termek_mentes', { p_id:t.id, p_nev:t.nev, p_leiras:t.leiras, p_ar:t.ar, p_kategoria:t.kategoria, p_emoji:t.emoji, p_vega:t.vega, p_allergenek:t.allergenek, p_aktiv:on, p_sorrend:t.sorrend });
            t.aktiv = on; toast(on ? `${t.nev}: rendelhető` : `${t.nev}: elrejtve az étlapról`); }
      catch (err) { el.setAttribute('aria-checked', !on); el.closest('.prod').classList.toggle('off', on); fail(err); }
      break;
    }
    case 'brk-toggle': el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'); break;
    // rendelések
    case 'dstep': { let d = addDays(A.day, +el.dataset.d); while ([0, 6].includes(parseDay(d).getDay())) d = addDays(d, +el.dataset.d); A.day = d; pageRendelesek(); break; }
    case 'dtoday': A.day = todayIso(); pageRendelesek(); break;
    case 'rrefresh': pageRendelesek(); break;
    case 'print': window.print(); break;
    // statisztika
    case 'range': A.range = el.dataset.r; pageStat(); break;
    case 'stat-csv': { const st = A.stat; if (!st) break;
      const csv = 'Nap\tRendelések\tÖsszeg (Ft)\n' + st.days.map(d => { const x = st.byDay[d] || { db:0, osszeg:0 }; return `${d}\t${x.db}\t${x.osszeg}`; }).join('\n') + '\n\nTermék\tDarab\n' + st.s.top.map(t => `${t.nev}\t${t.db}`).join('\n');
      openModal('Statisztika táblázatként', `<p class="lead">Jelöld ki az egészet (Ctrl+A), másold ki (Ctrl+C), és illeszd be egy Excel-táblába.</p><textarea class="input" id="stat-text" readonly>${esc(csv)}</textarea><div class="mf"><div class="r"><button class="btn" data-act="close-modal">Bezárás</button></div></div>`, true);
      const ta = $('#stat-text'); if (ta){ ta.focus(); ta.select(); } break; }
    // beállítások
    case 'save-settings': saveSettings(); break;
  }
});
// kapcsolók a modalban és a beállításoknál
document.addEventListener('click', e => {
  const sw = e.target.closest('.switch'); if (!sw || sw.dataset.act) return;
  if (!['u-aktiv','p-vega','p-aktiv','s-nyitva'].includes(sw.id)) return;
  const on = sw.getAttribute('aria-checked') !== 'true'; sw.setAttribute('aria-checked', on);
  if (sw.id === 'u-aktiv') $('#u-aktiv-l').textContent = on ? 'Aktív, beléphet' : 'Inaktív, nem léphet be';
  if (sw.id === 's-nyitva') $('#s-nyitva-l').textContent = on ? 'Lehet rendelni' : 'Szünetel';
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'login-form'){
    const id = $('#l-id').value.replace(/\D/g, ''), birth = normBirth($('#l-birth').value);
    if (id.length !== 11){ A.err = HIBAK.rossz_azonosito; return render(); }
    if (!birth){ A.err = 'A születési dátumot így add meg: 1980-01-01'; render(); $('#l-id').value = id; return; }
    return doLogin(id, birth);
  }
  if (f.id === 'first-form'){
    const nev = $('#f-nev').value.trim(), id = $('#f-id').value.replace(/\D/g, ''), birth = normBirth($('#f-birth').value);
    const err = m => { $('#err').textContent = m; };
    if (!nev) return err(HIBAK.hianyzo_nev);
    if (id.length !== 11) return err(HIBAK.rossz_azonosito);
    if (!birth) return err('A születési dátumot így add meg: 1980-01-01');
    try { const r = await API.call('admin_elso_letrehozas', { p_azonosito:id, p_nev:nev, p_szuletes:birth }); enter(r.token, r.felhasznalo); toast('Admin létrehozva. Üdv!'); }
    catch (x) { err(hibaSzoveg(x)); }
    return;
  }
  if (f.id === 'conn-form'){
    let url = $('#c-url').value.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, ''); const key = $('#c-key').value.trim();
    if (url && !/^https?:\/\//.test(url)) url = 'https://' + url;
    if (!url || !key){ A.err = 'Add meg mindkét értéket.'; render(); return; }
    if (/service_role|sb_secret_/.test(key) || (key.startsWith('eyJ') && /service_role/.test(atobSafe(key.split('.')[1])))){ A.err = 'Ez a titkos (secret / service_role) kulcs! Azt ne használd, a publishable (anon) kulcs kell.'; render(); return; }
    A.busy = true; A.err = ''; render(); $('#c-url').value = url; $('#c-key').value = key;
    const prev = [API.url, API.key]; API.configure(url, key);
    try {
      const r = await API.call('admin_van_admin', {});
      store.set(CONNKEY, { url, key }); A.busy = false; sess.del(); A.token = null;
      A.view = r.van ? 'login' : 'first'; render(); toast('Kapcsolat rendben');
    } catch (x) {
      API.configure(prev[0], prev[1]); A.busy = false;
      A.err = x.code === 'halozat' ? 'Nem érem el ezt a címet. Ellenőrizd a Project URL-t.'
            : /admin_van_admin|schema cache|Could not find/i.test(x.message) ? 'A kapcsolat működik, de az adatbázisban még nincsenek meg a BüféApp táblái. Futtasd le az SQL-fájlt az SQL Editorban.'
            : /Invalid API key|No API key|401|JWT/i.test(x.message) ? 'A kulcs nem jó. A publishable (anon) kulcsot másold be.'
            : 'Nem sikerült: ' + hibaSzoveg(x);
      render(); $('#c-url').value = url; $('#c-key').value = key;
    }
    return;
  }
  if (f.id === 'user-form') return saveUser();
  if (f.id === 'prod-form') return saveProd();
  if (f.classList.contains('brk')){
    const id = f.dataset.brk, nev = f.querySelector('[name=nev]').value.trim(), ido = f.querySelector('[name=ido]').value.trim(), aktiv = f.querySelector('[name=aktiv]').getAttribute('aria-checked') === 'true';
    try { await call('admin_szunet_mentes', { p_id:id, p_nev:nev, p_ido:ido, p_aktiv:aktiv }); toast('Szünet mentve'); } catch (x) { fail(x); }
  }
});
function atobSafe(s){ try { return atob(String(s || '').replace(/-/g, '+').replace(/_/g, '/')); } catch (e) { return ''; } }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'dq'){ clearTimeout(qTimer); qTimer = setTimeout(() => { A.q = t.value.trim(); A.pageNo = 0; pageDiakok(true); }, 250); }
  if (['l-birth','f-birth','u-birth'].includes(t.id)){
    const d = t.value.replace(/\D/g, '').slice(0, 8);
    t.value = d.slice(0, 4) + (d.length > 4 ? '-' + d.slice(4, 6) : '') + (d.length > 6 ? '-' + d.slice(6, 8) : '');
  }
  if (['l-id','f-id','u-id'].includes(t.id)) t.value = t.value.replace(/\D/g, '').slice(0, 11);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rday' && t.value){ A.day = t.value; pageRendelesek(); }
  if (t.id === 's-lemond') updatePreview();
  if (t.id === 'imp-file' && t.files && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      let txt = String(r.result || '');
      if (/\uFFFD/.test(txt)){ const r2 = new FileReader(); r2.onload = () => { $('#imp-text').value = r2.result; }; r2.readAsText(t.files[0], 'windows-1250'); return; }
      $('#imp-text').value = txt;
    };
    r.readAsText(t.files[0], 'utf-8');
  }
  if (t.id === 'imp-hdr'){ const I = A.imp; I.hasHeader = t.checked; I.map = I.hasHeader ? guessMap(I.rows[0]) : { azonosito:0, nev:1, vezetek:-1, kereszt:-1, osztaly:2, szuletes:3 }; analyse(); renderImport(); }
  if (t.dataset && t.dataset.map){ A.imp.map[t.dataset.map] = +t.value; if (t.dataset.map === 'nev' && +t.value >= 0){ A.imp.map.vezetek = -1; A.imp.map.kereszt = -1; } analyse(); renderImport(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal .mback') && !(A.imp && A.imp.step === 3 && !A.imp.done)) closeModal(); });

/* ---------- indítás ---------- */
$('#wm').innerHTML = `<img src="${LOGO_URL}" alt="">`;
render();
boot();

})();
</script>
</body>
