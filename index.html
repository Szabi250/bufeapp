<style>
:root{
  --bg:#eef1fb; --surface:rgba(255,255,255,.88); --solid:#ffffff; --paper:#fbfcff;
  --ink:#0f1533; --muted:#565e86; --line:rgba(16,26,104,.11); --tint:#e4e9fc;
  --p1:#101a68; --p2:#33459c; --on-p:#ffffff; --link:#24359a;
  --amber:#f2a33a; --amber-bg:#fdf0da; --amber-ink:#6b4200;
  --green:#137a52; --green-bg:#dcf4e8;
  --red:#b83232; --red-bg:#fbe3e3;
  --shadow:0 1px 2px rgba(16,26,104,.06),0 10px 28px rgba(16,26,104,.09);
  --wm-filter:grayscale(1); --wm-op:.055;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090e2b; --surface:rgba(22,30,84,.82); --solid:#141c50; --paper:#18215d;
    --ink:#eef0ff; --muted:#a2abdc; --line:rgba(255,255,255,.11); --tint:#222d75;
    --p1:#5a71ee; --p2:#7b90ff; --on-p:#080c28; --link:#a9b8ff;
    --amber-bg:#3b2b0f; --amber-ink:#ffd9a0;
    --green:#5fd4a0; --green-bg:#123a2b; --red:#ff9a9a; --red-bg:#4a1c24;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    --wm-filter:grayscale(1) brightness(3); --wm-op:.07;
  }
}
:root[data-theme="dark"]{
  --bg:#090e2b; --surface:rgba(22,30,84,.82); --solid:#141c50; --paper:#18215d;
  --ink:#eef0ff; --muted:#a2abdc; --line:rgba(255,255,255,.11); --tint:#222d75;
  --p1:#5a71ee; --p2:#7b90ff; --on-p:#080c28; --link:#a9b8ff;
  --amber-bg:#3b2b0f; --amber-ink:#ffd9a0;
  --green:#5fd4a0; --green-bg:#123a2b; --red:#ff9a9a; --red-bg:#4a1c24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --wm-filter:grayscale(1) brightness(3); --wm-op:.07;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100dvh;font-family:var(--body);font-size:16px;line-height:1.45;color:var(--ink);
  background:
    radial-gradient(62% 42% at 6% 4%,rgba(51,69,156,.34),transparent 72%),
    radial-gradient(56% 38% at 98% 16%,rgba(113,144,246,.30),transparent 72%),
    radial-gradient(70% 48% at 14% 94%,rgba(16,26,104,.26),transparent 72%),
    radial-gradient(52% 38% at 96% 90%,rgba(51,69,156,.24),transparent 72%),
    var(--bg);
  background-attachment:fixed;
}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
p{margin:0}

.wm{position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
.wm img,.wm svg{width:min(80vw,400px);height:auto;opacity:var(--wm-op);filter:var(--wm-filter)}
.shell{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;padding:0 16px 96px}
.shell.has-cart{padding-bottom:164px}

/* ---------- belépés / PIN ---------- */
.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 4px}
.crest{width:108px;height:108px;margin:0 auto 16px;display:grid;place-items:center;background:#fff;border-radius:30px;box-shadow:var(--shadow)}
.auth h1{text-align:center;font-size:34px;font-weight:800;line-height:1.05}
.auth .school{text-align:center;color:var(--muted);font-size:14px;margin:8px auto 22px;max-width:30ch}
.auth h2{text-align:center;font-size:24px;font-weight:700;margin-bottom:6px}
.auth .sub{text-align:center;color:var(--muted);margin:0 auto 18px;max-width:32ch}
.panel{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--solid);padding:0 14px;font-size:18px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.field input:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 4px rgba(51,69,156,.18)}
.help{font-size:13.5px;color:var(--muted);margin:-4px 0 16px}
.err{min-height:22px;color:var(--red);font-weight:600;font-size:14.5px;text-align:center;margin:0 0 10px}
.err:empty{min-height:0;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;font-weight:700;font-size:17px;color:var(--on-p);background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 6px 16px rgba(16,26,104,.25)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.ghost{background:var(--tint);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--red-bg);color:var(--red);box-shadow:none}
.btn.sm{height:44px;font-size:15px;border-radius:13px}
.link{display:block;margin:10px auto 0;padding:10px 14px;color:var(--link);font-weight:600;font-size:15px}
.demo{margin-top:16px;border:1.5px dashed var(--line);border-radius:16px;padding:10px 14px;background:var(--surface);font-size:14px}
.demo summary{cursor:pointer;font-weight:600;color:var(--muted)}
.demo button{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);margin-top:8px}
.demo button b{display:block}
.demo button small{color:var(--muted);font-variant-numeric:tabular-nums}

.avatar-lg{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:28px;color:var(--on-p);background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--shadow)}
.dots{display:flex;justify-content:center;gap:14px;margin:6px 0 10px;height:22px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--p2);transition:background .12s,transform .12s}
.dots i.on{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;transform:scale(1.08)}
.dots.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;width:min(100%,300px);margin:16px auto 0}
.keypad button{height:66px;border-radius:50%;font-family:var(--head);font-weight:600;font-size:28px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,26,104,.07);display:grid;place-items:center;user-select:none}
.keypad button:active{background:var(--tint);transform:scale(.96)}
.keypad .del{background:none;border-color:transparent;box-shadow:none;color:var(--muted)}

/* ---------- fejléc ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 2px 10px;margin:0 -2px;background:linear-gradient(var(--bg),rgba(0,0,0,0));background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 92%,transparent),transparent)}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:44px;height:44px;background:#fff;border-radius:12px;display:grid;place-items:center;box-shadow:var(--shadow)}
.brand b{display:block;font-family:var(--head);font-size:19px;font-weight:800;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.bell{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.bell .dot{position:absolute;top:10px;right:11px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--solid)}

.page-title{font-size:28px;font-weight:800;line-height:1.1;margin:8px 0 14px}

/* ---------- napválasztó ---------- */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.d{flex:0 0 auto;width:58px;padding:9px 0 8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px}
.d .w{font-size:13px;color:var(--muted);font-weight:600}
.d .n{font-family:var(--head);font-size:24px;font-weight:800;line-height:1.1}
.d .s{font-size:11px;color:var(--muted);min-height:14px;display:flex;align-items:center}
.d .s i{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.d.closed{opacity:.55}
.d[aria-pressed="true"]{background:linear-gradient(160deg,var(--p1),var(--p2));border-color:transparent;color:var(--on-p);box-shadow:0 6px 14px rgba(16,26,104,.25)}
.d[aria-pressed="true"] .w,.d[aria-pressed="true"] .s{color:inherit;opacity:.85}
.d[aria-pressed="true"] .s i{background:var(--amber)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--red-bg);color:var(--red);border:1.5px solid var(--red);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.4;margin:8px 0}
.warn svg{flex:none;margin-top:1px}
.warn b{font-weight:800}
.order small.cw{color:var(--red);font-weight:600}
.notice{background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:10px 14px;font-size:14.5px;margin:6px 0 12px;font-weight:500}

/* ---------- keresés, szűrők ---------- */
.search{position:relative;margin:8px 0 10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:48px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px 0 44px;font-size:16px}
.search input:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 4px rgba(51,69,156,.16)}
.chips{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--p2);color:var(--ink)}

/* ---------- étlap ---------- */
.cat{margin-top:18px}
.cat h2{font-size:21px;font-weight:700;margin-bottom:4px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.emo{width:52px;height:52px;border-radius:16px;background:var(--tint);display:grid;place-items:center;font-size:28px}
.info{min-width:0}
.info h3{font-size:16.5px;font-weight:700;line-height:1.2}
.info .desc{font-size:14px;color:var(--muted);margin-top:2px}
.info .meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.price{font-family:var(--head);font-size:16px;font-weight:700}
.vg{font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-bg);padding:2px 8px;border-radius:10px}
.fav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);margin:-4px 0}
.fav.on{color:var(--amber)}
.al{font-size:12.5px;color:var(--muted);margin-top:3px}
.add{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p1),var(--p2));color:var(--on-p);box-shadow:0 5px 12px rgba(16,26,104,.25)}
.add:disabled{opacity:.4;box-shadow:none}
.stepper{display:flex;align-items:center;background:var(--tint);border-radius:23px;height:46px}
.stepper button{width:42px;height:46px;display:grid;place-items:center;border-radius:23px}
.stepper output{min-width:22px;text-align:center;font-family:var(--head);font-weight:800;font-size:17px}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.empty b{display:block;color:var(--ink);font-family:var(--head);font-size:19px;margin-bottom:6px}

.cartbar{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),456px);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;height:56px;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 16px 0 10px;color:var(--on-p);background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 10px 26px rgba(16,26,104,.4);font-weight:700}
.cartbar .cnt{min-width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--head);font-size:17px}
.cartbar span.t{flex:1;text-align:left}
.cartbar b{font-family:var(--head);font-size:17px}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);z-index:9;display:flex;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--link);background:var(--tint)}
.tabs .bd{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#3a2400;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* ---------- rendelések ---------- */
.group-h{font-size:18px;font-weight:700;margin:20px 0 8px}
.order{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;box-shadow:var(--shadow)}
.order .o-main{flex:1;min-width:0}
.order b{display:block;font-family:var(--head);font-size:17px}
.order small{color:var(--muted);font-size:13.5px;display:block}
.order .o-side{text-align:right}
.order .o-side b{font-size:16px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:11px;margin-top:4px}
.pill.on{background:var(--tint);color:var(--link)}
.pill.off{background:var(--red-bg);color:var(--red)}
.pill.done{background:var(--green-bg);color:var(--green)}

/* ---------- profil ---------- */
.who{display:flex;align-items:center;gap:14px;margin:8px 0 6px}
.who .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:24px;color:var(--on-p);background:linear-gradient(135deg,var(--p1),var(--p2))}
.who h1{font-size:25px;font-weight:800;line-height:1.1}
.who p{color:var(--muted)}
.schoolname{color:var(--muted);font-size:14px;margin:0 0 14px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin:0 0 12px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.week{background:linear-gradient(150deg,var(--p1),var(--p2));color:var(--on-p);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 10px 24px rgba(16,26,104,.28)}
.week span{display:block;font-weight:600;opacity:.9}
.week b{display:block;font-family:var(--head);font-size:36px;font-weight:800;line-height:1.15}
.week small{opacity:.85}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:0 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;font-weight:600}
.row .grow{flex:1}
.row.danger{color:var(--red)}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* ---------- büfés összesítő ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--head);font-size:22px;font-weight:800;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted)}
.prep{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prep:last-child{border:0}
.prep .bar{height:6px;border-radius:3px;background:var(--tint);margin-top:5px;overflow:hidden}
.prep .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2))}
.prep b.q{font-family:var(--head);font-size:22px;font-weight:800}
.pk h3{font-size:16px;margin:16px 0 4px}
.pk li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.pk ul{margin:0;padding:0}
.pk li small{display:block;color:var(--muted)}

/* ---------- lapok (sheet) ---------- */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(8,12,48,.52);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,480px);max-height:90dvh;overflow:auto;background:var(--solid);border-radius:26px 26px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sh-head h2{font-size:23px;font-weight:800}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint);margin-right:-6px}
.sub-s{color:var(--muted);margin-bottom:10px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:600}
.line .pr{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.seg button{padding:10px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:600;line-height:1.25}
.seg button small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--p2);background:var(--tint)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px}
.total b{font-family:var(--head);font-size:26px;font-weight:800}
.pay-note{background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:10px 14px;font-size:14.5px;margin:8px 0 14px;font-weight:500}
.receipt{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0 14px;position:relative}
.receipt .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.receipt .rh b{font-family:var(--head);font-size:18px}
.receipt .rh small{display:block;color:var(--muted)}
.receipt .line{border-bottom:1px dashed var(--line)}
.receipt .total{border-top:2px dashed var(--line);margin-top:10px}
.n-item{padding:12px 0;border-bottom:1px solid var(--line)}
.n-item b{display:block}
.n-item p{color:var(--muted);font-size:14.5px}
.n-item.new b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:8px}
.priv h3{font-size:16px;margin:14px 0 2px}
.priv p{color:var(--muted);font-size:14.5px}
.devnote{border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);margin-top:12px}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);z-index:60;max-width:min(92vw,440px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 10px 28px rgba(0,0,0,.3);transition:transform .25s}
.toast{opacity:0;visibility:hidden}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.spinner{width:34px;height:34px;margin:18px auto 10px;border-radius:50%;border:3.5px solid var(--tint);border-top-color:var(--p2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.offline{display:flex;align-items:center;gap:8px;background:var(--red-bg);color:var(--red);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin:0 0 8px}
.offline button{margin-left:auto;text-decoration:underline;font-weight:700;color:inherit;padding:4px}
.demobar{background:var(--amber-bg);color:var(--amber-ink);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:600;margin:0 0 6px;text-align:center}
.demo-note{color:var(--muted);font-size:13.5px;margin:8px 0 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.wm img{object-fit:contain}

.step-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-size:17px;font-weight:700}
.step-h span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--on-p);background:linear-gradient(135deg,var(--p1),var(--p2));flex:none}
.brk-pick{margin-bottom:6px}
.brk-pick button{min-height:58px;font-size:16px}
.brk-pick.need button{border-color:var(--amber)}
.pick-hint{display:flex;align-items:center;gap:6px;color:var(--amber-ink);background:var(--amber-bg);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin:4px 0 6px}
.cartbar span.t small{display:block;font-weight:600;font-size:12.5px;opacity:.85}

/* értesítés-sáv és átvételi lista (büfés) */
.warnbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fdeaea;color:#8e1f1f;
  border:1px solid rgba(184,50,50,.35);border-radius:14px;padding:10px 14px;margin:0 16px 8px;font:inherit;font-size:15px;font-weight:600}
.warnbar svg{flex:none;color:#b83232}
.warnbar span{flex:1}
@media (prefers-color-scheme:dark){ .warnbar{background:#3a1717;color:#ffd9d9;border-color:rgba(255,120,120,.3)} }
.okw{color:#0f7a3d;font-weight:700}
.pklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pkrow{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;
  flex-direction:column;gap:10px}
.pkrow.done{border-color:rgba(15,122,61,.45);background:rgba(15,122,61,.07)}
.pkrow.miss{border-color:rgba(184,50,50,.45);background:rgba(184,50,50,.07)}
.pkwho b{font-size:16px}
.pkwho span{color:var(--muted);font-size:14px}
.pkwho small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pkbtns{display:flex;gap:8px}
.pkb{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:12px;
  border:1px solid var(--line);background:var(--tint);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.pkb.ok[aria-pressed=true]{background:#0f7a3d;border-color:#0f7a3d;color:#fff}
.pkb.no[aria-pressed=true]{background:#b83232;border-color:#b83232;color:#fff}
.pkb svg{flex:none}
.row .grow small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- apró segédek ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return iso(d); };
const ft = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' Ft';
const MONTHS_S = ['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
const WD = ['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const WD_SUB = ['vasárnapra','hétfőre','keddre','szerdára','csütörtökre','péntekre','szombatra'];
const WD_S = ['V','H','K','Sze','Cs','P','Szo'];
const dayLong = s => { const d = parseDay(s); return `${WD[d.getDay()]}, ${MONTHS_S[d.getMonth()]} ${d.getDate()}.`; };
/* A nap és az idő a szerver (iskola) órája szerint, hogy egy rosszul beállított
   telefonóra ne ajánljon lezárt napot. SRV_OFF-ot az app_adatok válasza állítja be. */
let SRV_OFF = 0;
const srvNow = () => new Date(Date.now() + SRV_OFF);
const setServerTime = (ma, perc) => {
  if (!ma) return;
  const [y, m, d] = String(ma).split('-').map(Number);
  if (!y || !m || !d) return;
  const p = Number(perc);
  const wall = new Date(y, m - 1, d, isNaN(p) ? 0 : Math.floor(p / 60), isNaN(p) ? 0 : p % 60, 0, 0);
  if (isNaN(p)){ const n = new Date(); wall.setHours(n.getHours(), n.getMinutes(), n.getSeconds(), 0); }
  SRV_OFF = wall.getTime() - Date.now();
};
const todayIso = () => iso(srvNow());
const givenName = n => String(n || '').trim().split(/\s+/).slice(-1)[0];
const initials = n => String(n || '').trim().split(/\s+/).map(w => w[0] || '').slice(0,2).join('').toUpperCase();
const maskId = id => String(id).slice(0,4) + '•••' + String(id).slice(-4);
const hhmmToMin = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };

function schoolDays(n = 5, from = srvNow()){
  const out = [], d = new Date(from); d.setHours(0,0,0,0);
  while (out.length < n){ const w = d.getDay(); if (w !== 0 && w !== 6) out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}

/* Születési dátum értelmezése sokféle írásmódból: 2007-10-20, 2007.10.20., 2007. 10. 20., 20071020 */
function normBirth(v){
  const d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.length !== 8) return null;
  const y = +d.slice(0,4), m = +d.slice(4,6), day = +d.slice(6,8);
  const t = new Date(y, m-1, day);
  if (y < 1900 || y > 2100 || t.getFullYear() !== y || t.getMonth() !== m-1 || t.getDate() !== day) return null;
  return `${y}-${pad(m)}-${pad(day)}`;
}

  get(k, d = null){ try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch(e){} return k in _mem ? _mem[k] : d; },
  set(k, v){ _mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ delete _mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};

/* =====================================================================
   API – ugyanazokat a függvényeket hívja a Supabase-ben, vagy demó
   módban a böngészőben futó utánzatot (Mock).
   ===================================================================== */
const API = {
  remote: !!(BUFE_CONFIG.supabaseUrl && BUFE_CONFIG.supabaseKey),
  url: BUFE_CONFIG.supabaseUrl,
  key: BUFE_CONFIG.supabaseKey,
  configure(url, key){
    this.url = String(url || '').trim().replace(/\/+$/, '');
    this.key = String(key || '').trim();
    this.remote = !!(this.url && this.key);
  },
  async call(fn, args = {}){
    if (!this.remote) return Mock.call(fn, JSON.parse(JSON.stringify(args)));
    const headers = { 'Content-Type': 'application/json', 'apikey': this.key };
    if (this.key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + this.key;
    let res;
    try {
      res = await fetch(`${this.url}/rest/v1/rpc/${fn}`, { method:'POST', headers, body: JSON.stringify(args) });
    } catch (e) {
      const err = new Error('halozat'); err.code = 'halozat'; throw err;
    }
    let body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok){
      const code = body && (body.message || body.error || body.msg) || ('HTTP ' + res.status);
      const err = new Error(code); err.code = code; err.status = res.status; throw err;
    }
    return body;
  }
};

/* ---------- PIN: lenyomat + a belépési kulcs titkosítása ---------- */
const hex = arr => [...arr].map(b => b.toString(16).padStart(2, '0')).join('');
const unhex = s => new Uint8Array((s.match(/.{2}/g) || []).map(h => parseInt(h, 16)));
function randBytes(n){
  const a = new Uint8Array(n);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
  return a;
}
const hasSubtle = () => !!(window.crypto && crypto.subtle);
async function pinMaterial(pin, salt){
  const enc = new TextEncoder();
  if (hasSubtle()){
    try {
      const key = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(salt), iterations:150000, hash:'SHA-256' }, key, 512));
      const aes = await crypto.subtle.importKey('raw', bits.slice(32), 'AES-GCM', false, ['encrypt', 'decrypt']);
      return { hash: hex(bits.slice(0, 32)), aes };
    } catch (e) {}
  }
  let h = 5381; const s = salt + pin;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return { hash: 'x' + (h >>> 0).toString(16), aes: null };
}
async function sealToken(token, aes){
  if (!aes) return { plain: token };
  const iv = randBytes(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, aes, new TextEncoder().encode(token)));
  return { iv: hex(iv), ct: hex(ct) };
}
async function openToken(box, aes){
  if (box.plain) return box.plain;
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unhex(box.iv) }, aes, unhex(box.ct));
  return new TextDecoder().decode(pt);
}
function weakPin(p){
  if (/^(\d)\1{5}$/.test(p)) return true;
  const d = p.split('').map(Number);
  const up = d.every((x, i) => i === 0 || x === (d[i-1] + 1) % 10);
  const down = d.every((x, i) => i === 0 || x === (d[i-1] + 9) % 10);
  return up || down || /^(\d\d)\1\1$/.test(p) || /^(\d{3})\1$/.test(p);
}

function isClosed(day){
  if (settings().rendeles_nyitva === false) return true;
  const now = srvNow(), t = iso(now);
  if (day < t) return true;
  if (day === t) return now.getHours() * 60 + now.getMinutes() >= hhmmToMin(cutoffText());
  return false;
}
const cancelDeadline = day => addDays(day, -cancelDays());
const canCancelDay = day => todayIso() <= cancelDeadline(day);

const deadlineText = day => dayLong(cancelDeadline(day));

/* A szervertől kapott üzenetek (emlékeztető, „nem vetted át”) bekerülnek az értesítések közé. */
function mergeServerNotifs(list){
  if (!Array.isArray(list) || !list.length) return;
  const seen = new Set(S.notifs.map(n => n.sid).filter(x => x != null));
  let uj = 0;
  list.slice().reverse().forEach(e => {
    if (seen.has(e.id)) return;
    addNotif(e.cim, e.szoveg, { sid:e.id, tipus:e.tipus });
    uj++;
  });
  if (uj) saveNotifs();
}

/* ---------- telefonos értesítés (Web Push) ---------- */
const pushLehet = () => !isDemo() && !!BUFE_CONFIG.pushKey && 'serviceWorker' in navigator
  && 'PushManager' in window && 'Notification' in window;
const b64ToU8 = b64 => {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
};
const subKulcs = (sub, nev) => {
  const k = sub.getKey ? sub.getKey(nev) : null;
  return k ? btoa(String.fromCharCode(...new Uint8Array(k))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : '';
};
async function pushBe(){
  const reg = await navigator.serviceWorker.ready;
  const eng = await Notification.requestPermission();
  if (eng !== 'granted') return { ok:false, kod:'tiltva' };
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToU8(BUFE_CONFIG.pushKey) });
  await API.call('app_push_regisztral', { p_token:S.token, p_endpoint:sub.endpoint,
    p_p256dh:subKulcs(sub, 'p256dh'), p_auth:subKulcs(sub, 'auth') });
  return { ok:true };
}
async function pushKi(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub){ try { await API.call('app_push_torles', { p_token:S.token, p_endpoint:sub.endpoint }); } catch (e) {} await sub.unsubscribe(); }
}

  S.busy = true; setErr(''); $('#login-btn').disabled = true; $('#login-btn').textContent = 'Ellenőrzés…';
  let r;
  try { r = await API.call('app_belepes', { p_azonosito: id, p_szuletes: birth }); }
  catch (e) { r = { ok:false, kod:'halozat', e }; }
  S.busy = false;
  if (!r.ok){
    S.err = r.kod === 'zarolva' ? `Túl sok hibás próbálkozás. Próbáld újra ${r.perc || 15} perc múlva.`
          : r.kod === 'halozat' ? hibaSzoveg(r.e)
          : 'Az azonosító vagy a születési dátum nem egyezik, vagy nem vagy rajta az iskola listáján.';
    const idv = $('#f-id').value, bv = $('#f-birth').value;
    render(); $('#f-id').value = idv; $('#f-birth').value = bv;
    return;
  }
  S.pending = { token: r.token, user: r.felhasznalo }; S.prefillId = ''; S.notice = ''; S.err = '';
  S.view = 'setpin'; S.pinStep = 'new'; S.pin = ''; S.pinFirst = '';
  render();
}

/* ---------- PIN ---------- */
function viewPin(){
  const setting = S.view === 'setpin';
  const name = setting ? S.pending.user.nev : S.device.nev;
  const title = setting ? (S.pinStep === 'new' ? 'Állíts be egy PIN-kódot' : 'Írd be még egyszer') : `Szia, ${esc(givenName(name))}!`;
  const sub = setting
    ? (S.pinStep === 'new' ? `Szia, ${esc(givenName(name))}! Ezzel a 6 számjegyű kóddal lépsz be legközelebb.` : 'Ugyanazt a 6 számjegyet add meg megerősítésként.')
    : 'Írd be a PIN-kódodat.';
  const links = setting
    ? `<button class="link" data-act="cancel-setpin">Mégsem</button>`
    : `<button class="link" data-act="forgot">Elfelejtettem a PIN-kódom</button><button class="link" data-act="switch">Nem ${esc(givenName(name))} vagyok</button>`;
  return `
  <main class="auth">
    <div class="avatar-lg" aria-hidden="true">${esc(initials(name))}</div>
    <h2>${title}</h2>
    <p class="sub">${sub}</p>
    <div class="dots" id="dots" role="img" aria-label="PIN: ${S.pin.length} számjegy megadva">${dotsHTML()}</div>
    <p class="err" id="err" role="alert">${esc(S.err)}</p>
    <div class="keypad" role="group" aria-label="PIN billentyűzet">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" data-act="key" data-k="${n}" aria-label="${n}">${n}</button>`).join('')}
      <span></span>
      <button type="button" data-act="key" data-k="0" aria-label="0">0</button>
      <button type="button" class="del" data-act="del" aria-label="Utolsó számjegy törlése">${ic('back', 26)}</button>
    </div>
    ${links}
  </main>`;
}
const dotsHTML = () => Array.from({ length:6 }, (_, i) => `<i class="${i < S.pin.length ? 'on' : ''}"></i>`).join('');
function updateDots(){ const d = $('#dots'); if (d){ d.innerHTML = dotsHTML(); d.setAttribute('aria-label', `PIN: ${S.pin.length} számjegy megadva`); } }
function shake(){ const d = $('#dots'); if (!d) return; d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
function onDigit(k){
  if (S.busy || S.pin.length >= 6) return;
  S.pin += k; setErr(''); updateDots();
  if (S.pin.length === 6) setTimeout(submitPin, 140);
}
function onDel(){ if (S.busy) return; S.pin = S.pin.slice(0, -1); updateDots(); }

async function submitPin(){
  if (S.busy || S.pin.length !== 6) return;
  S.busy = true;
  const pin = S.pin;
  if (S.view === 'setpin'){
    if (S.pinStep === 'new'){
      if (weakPin(pin)){ S.pin = ''; S.busy = false; updateDots(); shake(); return setErr('Ez a PIN túl könnyen kitalálható. Válassz másikat.'); }
      S.pinFirst = pin; S.pinStep = 'confirm'; S.pin = ''; S.err = ''; S.busy = false; render(); return;
    }
    if (pin !== S.pinFirst){
      S.pin = ''; S.pinFirst = ''; S.pinStep = 'new'; S.busy = false; S.err = 'A két PIN nem egyezik. Kezdjük elölről.'; render(); shake(); return;
    }
    const salt = hex(randBytes(12)), m = await pinMaterial(pin, salt);
    const u = S.pending.user, token = S.pending.token;
    S.device = { azonosito:u.azonosito, nev:u.nev, osztaly:u.osztaly, szerep:u.szerep, salt, hash:m.hash, box: await sealToken(token, m.aes), fails:0 };
    store.set(DEVKEY, S.device);
    S.busy = false; S.pending = null;
    enterApp(token, true);
    return;
  }
  const dev = S.device, m = await pinMaterial(pin, dev.salt);
  if (m.hash === dev.hash){
    let token = null;
    try { token = await openToken(dev.box, m.aes); } catch (e) {}
    dev.fails = 0; store.set(DEVKEY, dev); S.busy = false;
    if (!token){ return forceRelogin('A belépésed megsérült ezen az eszközön. Lépj be újra.'); }
    enterApp(token, false); return;
  }
  dev.fails = (dev.fails || 0) + 1;
  if (dev.fails >= PIN_MAX_FAILS){
    S.busy = false;
    return forceRelogin('Ötször hibás PIN. Biztonsági okból lépj be újra az azonosítóddal és a születési dátumoddal.');
  }
  store.set(DEVKEY, dev);
  S.pin = ''; S.busy = false; updateDots(); shake();
  setErr(`Hibás PIN. Még ${PIN_MAX_FAILS - dev.fails} próbálkozásod van.`);
}

function forceRelogin(notice){
  const id = S.device ? S.device.azonosito : (S.user ? S.user.azonosito : '');
  store.del(DEVKEY);
  S.device = null; S.user = null; S.token = null; S.data = null; S.carts = {}; S.staff = {};
  S.prefillId = id; S.notice = notice || ''; S.view = 'login'; S.err = ''; S.pin = ''; S.busy = false;
  closeSheet(true); render(); window.scrollTo(0, 0);
}

/* ---------- adatok betöltése ---------- */
async function enterApp(token, first){
  S.token = token;
  S.user = { azonosito:S.device.azonosito, nev:S.device.nev, osztaly:S.device.osztaly, szerep:S.device.szerep };
  S.favs = store.get(K('favs'), []); S.notifs = store.get(K('notifs'), []); S.prefs = store.get(K('prefs'), {});
  S.view = 'loading'; S.err = ''; S.pin = ''; render();
  const ok = await loadData(true);
  if (!ok) return;
  if (first && !S.notifs.length) addNotif('Üdv a BüféApp-ban!', 'Rendelj előre a következő napokra, és a büfében csak át kell venned. Fizetni is ott kell.');
  S.vega = !!S.prefs.vega; S.fav = false; S.q = ''; S.sheet = null; S.staff = {};
  const days = schoolDays();
  S.day = S.user.szerep === 'diak' ? (days.find(d => !isClosed(d)) || days[0]) : days[0];
  S.brk = null;
  S.tab = S.user.szerep === 'diak' ? 'menu' : 'staff';
  S.view = 'main'; closeSheet(true); render();
  if (first) toast('PIN beállítva. Legközelebb elég ennyi.');
  if (S.tab === 'staff') loadStaff(S.day);
}

async function loadData(initial){
  try {
    const d = await API.call('app_adatok', { p_token: S.token });
    setServerTime(d.ma, d.perc);
    S.data = d; S.offline = false;
    mergeServerNotifs(d.ertesitesek);
    S.user = d.felhasznalo;
    Object.assign(S.device, { nev:d.felhasznalo.nev, osztaly:d.felhasznalo.osztaly, szerep:d.felhasznalo.szerep });
    store.set(DEVKEY, S.device);
    store.set(K('cache'), d);
    return true;
  } catch (e) {
    if (e.code === 'nincs_belepve'){ forceRelogin('A belépésed megszűnt (például lejárt, vagy az iskola kivett a listáról). Lépj be újra.'); return false; }
    const cached = store.get(K('cache'), null);
    if (cached){ S.data = cached; S.offline = true; if (!initial) toast(hibaSzoveg(e)); return true; }
    S.view = 'pin'; S.err = hibaSzoveg(e); render(); return false;
  }
}
async function refreshOrders(){
  try { S.data.rendelesek = await API.call('app_rendeleseim', { p_token: S.token }); store.set(K('cache'), S.data); S.offline = false; }
  catch (e) { if (e.code === 'nincs_belepve') return forceRelogin(hibaSzoveg(e)); }
}
async function loadStaff(day, force){
  if (S.staff[day] && !force) return;
  S.staffLoading = true; if (S.tab === 'staff') rerenderContent();
  try { S.staff[day] = await API.call('app_bufe_nap', { p_token: S.token, p_nap: day }); }
  catch (e) { if (e.code === 'nincs_belepve') return forceRelogin(hibaSzoveg(e)); toast(hibaSzoveg(e)); }
  S.staffLoading = false; if (S.tab === 'staff') rerenderContent();
}
function rerenderContent(){
  const c = $('#content'); if (!c || S.view !== 'main') return;
  const strip = $('#days'), sl = strip ? strip.scrollLeft : 0;
  c.innerHTML = contentHTML();
  const s2 = $('#days'); if (s2) s2.scrollLeft = sl;
}

function lockApp(){
  S.user = null; S.token = null; S.data = null; S.carts = {}; S.staff = {}; S.pin = ''; S.err = ''; S.sheet = null;
  document.body.classList.remove('noscroll'); $('#sheet').innerHTML = '';

async function logout(notice){
  const tok = S.token;
  if (tok) API.call('app_kilepes', { p_token: tok }).catch(() => {});
  store.del(DEVKEY);
  S.device = null; S.user = null; S.token = null; S.data = null; S.carts = {}; S.staff = {};
  S.prefillId = ''; S.notice = notice || ''; S.view = 'login'; S.err = ''; S.pin = '';

    : `<p class="sub-s">A telefonos értesítéshez tedd fel az appot a főképernyőre (Megosztás → Főképernyőhöz adás), és nyisd meg onnan.</p>`}`}
  <button class="row" data-act="privacy">${ic('shield', 20)}<span class="grow">Adatkezelés és adataim törlése</span>${ic('chev', 18)}</button>
  <button class="row" data-act="lock">${ic('lock', 20)}<span class="grow">Zárolás</span>${ic('chev', 18)}</button>
  <button class="row danger" data-act="logout">${ic('logout', 20)}<span class="grow">Kijelentkezés erről az eszközről</span></button>
  ${isDemo() ? `<button class="row" data-act="demo-reset">${ic('refresh', 20)}<span class="grow">Demó adatok visszaállítása</span></button>` : ''}`;
}

/* ---------- büfés összesítő ---------- */
function viewStaff(){
  const d = S.staff[S.day];
  const head = `<div class="title-row"><h1 class="page-title">Mit kell előkészíteni?</h1><button class="iconbtn" data-act="staff-refresh" aria-label="Frissítés">${ic('refresh', 20)}</button></div>${daysStrip(true)}`;
  if (!d) return head + (S.staffLoading ? `<div class="spinner" aria-hidden="true"></div><p class="sub" role="status" style="text-align:center">Betöltés…</p>` : `<div class="empty"><b>Nem sikerült betölteni</b><button class="btn sm" data-act="staff-refresh" style="max-width:220px;margin:12px auto 0">Újrapróbálom</button></div>`);
  const rows = d.osszesites || [], max = rows.length ? rows[0].db : 1;
  const prep = rows.length ? rows.map(r => `<div class="prep"><span style="font-size:26px" aria-hidden="true">${esc(r.emoji || '🍽️')}</span><div><b>${esc(r.nev)}</b><div class="bar"><i style="width:${Math.round(r.db / max * 100)}%"></i></div></div><b class="q">${r.db}</b></div>`).join('')
    : `<div class="empty"><b>Erre a napra még nincs rendelés</b>Válassz másik napot.</div>`;
  const pkRow = o => `<li class="pkrow${o.atvetel ? ' ' + (o.atvetel === 'atvette' ? 'done' : 'miss') : ''}">
    <div class="pkwho"><b>${esc(o.nev)}</b> <span>(${esc(o.osztaly)}) · ${ft(o.osszeg)}</span><small>${esc(o.tetelek)}</small></div>
    <div class="pkbtns">
      <button class="pkb ok" data-act="pk-ok" data-id="${o.id}" aria-pressed="${o.atvetel === 'atvette'}">${ic('check', 18)} Átvette</button>
      <button class="pkb no" data-act="pk-no" data-id="${o.id}" aria-pressed="${o.atvetel === 'nem_vette_at'}">${ic('x', 18)} Nem vette át</button>
    </div></li>`;
  const pk = (d.atvetel || []).filter(b => b.rendelesek.length).map(b => {
    const kesz = b.rendelesek.filter(o => o.atvetel).length;
    return `<h3>${esc(b.szunet)}, ${esc(b.ido)} <small>${kesz}/${b.rendelesek.length} kész</small></h3>
      <ul class="pklist">${b.rendelesek.map(pkRow).join('')}</ul>`;
  }).join('');
  return `${head}
  <div class="stats"><div class="stat"><b>${d.rendeles_db}</b><span>rendelés</span></div><div class="stat"><b>${d.darab}</b><span>darab</span></div><div class="stat"><b>${ft(d.bevetel)}</b><span>fizetendő</span></div></div>
  <h2 class="group-h">Előkészítés</h2>${prep}
  ${pk ? `<div class="pk"><h2 class="group-h" style="margin-bottom:0">Átvételi lista</h2>${pk}</div>` : ''}`;
}

/* =====================================================================
   LAPOK (sheet)
   ===================================================================== */
function openSheet(kind, extra = {}){ S.sheet = { kind, ...extra }; renderSheet(); document.body.classList.add('noscroll'); const c = $('#sheet .x'); if (c) c.focus(); }
function closeSheet(silent){
  S.sheet = null; $('#sheet').innerHTML = ''; document.body.classList.remove('noscroll');
  if (!silent && S.view === 'main') render();
}
function renderSheet(){
  const sh = S.sheet; if (!sh){ $('#sheet').innerHTML = ''; return; }
  let title = '', body = '';
  if (sh.kind === 'cart'){ title = 'Kosár'; body = cartSheet(); }
  else if (sh.kind === 'order'){ const o = orders().find(x => String(x.id) === String(sh.oid)); if (!o) return closeSheet(true); title = `Rendelés #${o.id}`; body = orderSheet(o, sh.confirm); }
  else if (sh.kind === 'notifs'){ title = 'Értesítések'; body = notifSheet(sh.unread || []); }
  else if (sh.kind === 'privacy'){ title = 'Adatkezelés'; body = privacySheet(sh.confirm); }
  $('#sheet').innerHTML = `<div class="sheet-back" data-act="sheet-back"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sh-head"><h2>${esc(title)}</h2><button class="x" data-act="sheet-close" aria-label="Bezárás">${ic('x', 20)}</button></div>${body}</div></div>`;
}
function cartSheet(){
  const day = S.day, lines = cartLines(day);
  if (!lines.length) return `<div class="empty"><b>A kosarad üres</b>Adj hozzá valamit az étlapról.</div>`;
  if (S.brk && !breaks().some(b => b.id === S.brk)) S.brk = null;
  const need = !S.brk;
  return `
  <p class="sub-s">Átvétel napja: <b>${dayLong(day)}</b></p>
  <h3 class="step-h"><span>1</span>Melyik szünetre kéred?</h3>
  <div class="seg brk-pick${need ? ' need' : ''}" role="radiogroup" aria-label="Átvételi szünet">${breaks().map(b => `<button role="radio" data-act="brk" data-b="${b.id}" aria-checked="${S.brk === b.id}" aria-pressed="${S.brk === b.id}">${esc(b.nev)}<small>${esc(b.ido)}</small></button>`).join('')}</div>
  ${need ? `<p class="pick-hint">${ic('alert', 16)} Válaszd ki, melyik szünetben veszed át a büfében.</p>` : ''}
  <h3 class="step-h"><span>2</span>Mit rendelsz?</h3>
  ${lines.map(l => `<div class="line"><span class="nm">${esc(l.p.nev)}</span><span class="pr">${ft(l.p.ar * l.qty)}</span>
     <div class="stepper" style="grid-column:1/-1;width:max-content;height:40px"><button data-act="sub" data-pid="${l.p.id}" aria-label="Kevesebb: ${esc(l.p.nev)}" style="height:40px">${ic('minus', 16)}</button><output>${l.qty}</output><button data-act="add" data-pid="${l.p.id}" aria-label="Több: ${esc(l.p.nev)}" style="height:40px">${ic('plus', 16)}</button></div></div>`).join('')}
  <div class="total"><span>Összesen</span><b>${ft(cartTotal(day))}</b></div>
  <p class="pay-note">Fizetés helyben, az átvételkor készpénzzel vagy kártyával.</p>
  ${cancelWarn(day)}
  <button class="btn" data-act="place" style="margin-top:14px"${S.busy || need ? ' disabled' : ''}>${S.busy ? 'Küldés…' : need ? 'Előbb válaszd ki a szünetet' : `Rendelés leadása: ${esc(breakOf(S.brk).nev)}, ${esc(breakOf(S.brk).ido)}`}</button>`;
}
function orderSheet(o, confirm){
  const st = statusOf(o), br = orderBreak(o), cc = canCancel(o);
  return `
  <div class="receipt">
    <div class="rh"><div><b>${dayLong(o.nap)}</b><small>${esc(br.nev)}${br.ido ? ', ' + esc(br.ido) : ''}</small></div><span class="pill ${st.cls}">${st.label}</span></div>
    ${o.tetelek.map(i => `<div class="line"><span class="nm">${i.db} × ${esc(i.nev)}</span><span class="pr">${ft(i.ar * i.db)}</span></div>`).join('')}
    <div class="total"><span>${o.statusz === 'lemondva' ? 'Lemondott összeg' : 'Fizetendő a büfénél'}</span><b>${ft(o.osszeg)}</b></div>
  </div>
  ${o.statusz === 'leadva' ? `<p class="pay-note">Fizetés helyben, az átvételkor készpénzzel vagy kártyával.</p>${o.nap >= todayIso() ? cancelWarn(o.nap) : ''}` : ''}
  ${cc ? (confirm
    ? `<p style="font-weight:600;margin:16px 0 10px">Biztosan lemondod ezt a rendelést? A lemondást nem lehet visszavonni.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost sm" data-act="cancel-no">Mégsem</button><button class="btn danger sm" data-act="cancel-yes"${S.busy ? ' disabled' : ''}>${S.busy ? 'Lemondás…' : 'Lemondom'}</button></div>`
    : `<button class="btn danger" data-act="cancel-ask" style="margin-top:14px">Rendelés lemondása</button>`) : ''}`;
}
function notifSheet(unread){
  if (!S.notifs.length) return `<div class="empty"><b>Nincs értesítésed</b>Itt látod majd a rendeléseid visszaigazolását.</div>`;
  return S.notifs.map(n => `<div class="n-item${unread.includes(n.id) ? ' new' : ''}"><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`).join('');
}
function privacySheet(confirm){
  return `<div class="priv">
    <h3>Mit tárol az app?</h3><p>Az iskola szerverén: a nevedet, az osztályodat, az oktatási azonosítódat és a rendeléseidet. A születési dátumodat csak titkosított lenyomatként. Ezen a telefonon: a kedvenceidet, az értesítéseidet és a titkosított belépési kulcsodat. A PIN-kódod sehol nincs eltárolva.</p>
    <h3>Mire használjuk?</h3><p>Kizárólag a büfé előrendeléséhez és az átvétel megszervezéséhez.</p>
    <h3>Ki kezeli az adataidat?</h3><p>${esc(schoolName())}. Kérdés esetén keresd az iskola titkárságát.</p>
    ${LIVE_BUILD ? `<p style="margin-top:10px"><a href="privacy.html" target="_blank" rel="noopener" style="color:var(--link);font-weight:600">A teljes adatkezelési tájékoztató</a></p>` : ''}
  </div>
  <div style="margin-top:18px">${confirm
    ? `<p style="font-weight:600;margin:0 0 10px">Minden adatod törlődik erről az eszközről, és kijelentkezel. Az iskolai nyilvántartást ez nem érinti. Folytatod?</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost sm" data-act="wipe-no">Mégsem</button><button class="btn danger sm" data-act="wipe-yes">Törlés</button></div>`
    : `<button class="btn danger" data-act="wipe-ask">Adataim törlése erről az eszközről</button>`}</div>`;
}

/* =====================================================================
   MŰVELETEK
   ===================================================================== */
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

function addToCart(pid, delta){
  const day = S.day; if (isClosed(day) && delta > 0) return toast('Erre a napra már lezárult a rendelés.');
  const max = +settings().max_tetel || 20;
  if (delta > 0 && cartCount(day) >= max) return toast(`Egy rendelésben legfeljebb ${max} darab lehet.`);
  const c = S.carts[day] = S.carts[day] || {};
  c[pid] = Math.max(0, (c[pid] || 0) + delta);
  if (!c[pid]) delete c[pid];
  refreshMenu();
  if (S.sheet && S.sheet.kind === 'cart'){ if (!cartCount(day)) closeSheet(true); else renderSheet(); }
}
async function placeOrder(){
  const day = S.day;
  if (S.busy) return;
  if (isClosed(day)) return toast('Erre a napra már lezárult a rendelés.');
  const lines = cartLines(day); if (!lines.length) return;
  if (!S.brk){ renderSheet(); return toast('Előbb válaszd ki, melyik szünetben veszed át.'); }
  const br = breakOf(S.brk);
  S.busy = true; renderSheet();
  try {
    const r = await API.call('app_rendeles_leadas', { p_token:S.token, p_nap:day, p_szunet:S.brk, p_tetelek: lines.map(l => ({ id:l.p.id, db:l.qty })) });
    addNotif('Rendelés leadva', `${dayLong(day)}, ${br.nev} (${br.ido}). Fizetendő a büfénél: ${ft(r.osszeg)}. ${r.lemondhato ? 'Lemondható legkésőbb: ' + deadlineText(day) + '.' : 'Már nem mondható le.'}`);
    delete S.carts[day]; S.brk = null;
    await refreshOrders();
    S.busy = false; closeSheet(true); S.tab = 'orders'; render(); window.scrollTo(0, 0);
    toast('Rendelés leadva');
  } catch (e) {
    S.busy = false;
    if (e.code === 'nincs_belepve') return forceRelogin(hibaSzoveg(e));
    if (e.code === 'ismeretlen_termek' || e.code === 'ismeretlen_szunet')
      loadData(false).then(() => { if (S.brk && !breaks().some(b => b.id === S.brk)) S.brk = null; refreshMenu(); renderSheet(); });
    renderSheet(); toast(hibaSzoveg(e));
  }
}
async function cancelOrder(oid){
  const o = orders().find(x => String(x.id) === String(oid)); if (!o || S.busy) return;
  if (!canCancel(o)){ closeSheet(true); render(); return toast('Ez a rendelés már nem mondható le.'); }
  S.busy = true; renderSheet();
  try {
    await API.call('app_rendeles_lemondas', { p_token:S.token, p_id:o.id });
    addNotif('Rendelés lemondva', `A(z) ${dayLong(o.nap)} rendelésedet lemondtad. Nincs teendőd, fizetni sem kell.`);
    await refreshOrders();
    S.busy = false; closeSheet(true); render(); toast('Rendelés lemondva');
  } catch (e) {
    S.busy = false;
    if (e.code === 'nincs_belepve') return forceRelogin(hibaSzoveg(e));
    await refreshOrders(); closeSheet(true); render(); toast(hibaSzoveg(e));
  }
}
function wipeData(){
  const id = S.user.azonosito;
  ['favs','notifs','prefs','cache'].forEach(k => store.del(`bufe.${k}.${id}`));
  logout('Az adataidat töröltük erről az eszközről.');
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a){
    case 'sheet-back': if (e.target === el) closeSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'demo-fill': $('#f-id').value = el.dataset.id; $('#f-birth').value = el.dataset.birth; setErr(''); break;
    case 'key': onDigit(el.dataset.k); break;
    case 'del': onDel(); break;
    case 'cancel-setpin': if (S.pending) API.call('app_kilepes', { p_token:S.pending.token }).catch(() => {}); S.pending = null; S.view = 'login'; S.err = ''; S.pin = ''; render(); break;
    case 'forgot': forceRelogin('Add meg újra az azonosítódat és a születési dátumodat, utána új PIN-kódot állíthatsz be.'); break;
    case 'switch': store.del(DEVKEY); S.device = null; S.prefillId = ''; S.notice = ''; S.view = 'login'; S.err = ''; S.pin = ''; render(); break;
    case 'lock': lockApp(); break;
    case 'logout': logout(''); break;
    case 'retry': loadData(false).then(ok => { if (ok) render(); }); break;
    case 'demo-reset': if (!isDemo()) break; Mock.reset(); S.carts = {}; S.staff = {}; loadData(false).then(() => { render(); toast('Demó adatok visszaállítva'); }); break;
    case 'tab':
      S.tab = el.dataset.tab; closeSheet(true); render(); window.scrollTo(0, 0);
      if (S.tab === 'orders') refreshOrders().then(() => { if (S.tab === 'orders') rerenderContent(); });
      if (S.tab === 'staff') loadStaff(S.day);
      break;
    case 'day': {
      const y = window.scrollY; S.day = el.dataset.day;
      if (S.tab === 'staff'){ rerenderContent(); loadStaff(S.day); }
      else { rerenderContent(); refreshCartbar(); }
      window.scrollTo(0, y); break;
    }
    case 'staff-refresh': loadStaff(S.day, true); break;
    case 'pk-ok': case 'pk-no': {
      const id = el.dataset.id, atvette = el.dataset.act === 'pk-ok';
      const nap = S.staff[S.day]; if (!nap) break;
      const sor = (nap.atvetel || []).flatMap(b => b.rendelesek).find(o => String(o.id) === String(id));
      const elozo = sor ? sor.atvetel : null;
      if (sor){ sor.atvetel = atvette ? 'atvette' : 'nem_vette_at'; rerenderContent(); }
      try { await API.call('app_bufe_atvetel', { p_token:S.token, p_id:+id, p_atvette:atvette });
            toast(atvette ? 'Átvette' : 'Nem vette át – üzenetet kap'); }
      catch (e) { if (sor){ sor.atvetel = elozo; rerenderContent(); } toast(hibaSzoveg(e)); }
      break;
    }
    case 'push-pref': {
      const be = !S.prefs.push;
      if (!pushLehet()) return toast('Ez az eszköz nem támogatja a telefonos értesítést.');
      if (be){
        try { const r = await pushBe();
              if (!r.ok){ toast('Az értesítés le van tiltva. Engedélyezd a böngésző beállításaiban.'); break; }
              S.prefs.push = true; savePrefs(); render(); toast('Értesítések bekapcsolva'); }
        catch (e) { toast('Nem sikerült bekapcsolni: ' + hibaSzoveg(e)); }
      } else {
        try { await pushKi(); } catch (e) {}
        S.prefs.push = false; savePrefs(); render(); toast('Értesítések kikapcsolva');
      }
      break;
    }
    case 'filter': if (el.dataset.f === 'fav') S.fav = !S.fav; else S.vega = !S.vega; refreshMenu(); break;
    case 'fav': { const id = el.dataset.pid; S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : [...S.favs, id]; saveFavs(); const y = window.scrollY; refreshMenu(); window.scrollTo(0, y); break; }
    case 'add': addToCart(el.dataset.pid, 1); break;
    case 'sub': addToCart(el.dataset.pid, -1); break;
    case 'cart': openSheet('cart'); break;
    case 'brk': S.brk = el.dataset.b; renderSheet(); break;
    case 'place': placeOrder(); break;
    case 'order': openSheet('order', { oid:el.dataset.oid }); break;
    case 'cancel-ask': S.sheet.confirm = true; renderSheet(); break;
    case 'cancel-no': S.sheet.confirm = false; renderSheet(); break;
    case 'cancel-yes': cancelOrder(S.sheet.oid); break;
    case 'notifs': { const un = S.notifs.filter(n => !n.read).map(n => n.id); S.notifs.forEach(n => n.read = true); saveNotifs(); render(); openSheet('notifs', { unread:un });
      if (S.notifs.some(n => n.sid != null)) API.call('app_ertesites_olvasva', { p_token:S.token }).catch(() => {});
      break; }
    case 'vega-pref': S.prefs.vega = !S.prefs.vega; S.vega = S.prefs.vega; savePrefs(); render(); break;
    case 'privacy': openSheet('privacy'); break;
    case 'wipe-ask': S.sheet.confirm = true; renderSheet(); break;
    case 'wipe-no': S.sheet.confirm = false; renderSheet(); break;
    case 'wipe-yes': wipeData(); break;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'login-form'){ e.preventDefault(); submitLogin(); } });
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ S.q = e.target.value; const l = $('#list'); if (l) l.innerHTML = menuListHTML(); }
  else if (e.target.id === 'f-birth'){
    const d = e.target.value.replace(/\D/g, '').slice(0, 8);
    e.target.value = d.slice(0, 4) + (d.length > 4 ? '-' + d.slice(4, 6) : '') + (d.length > 6 ? '-' + d.slice(6, 8) : '');
  }
  else if (e.target.id === 'f-id'){ e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) return closeSheet();
  if ((S.view === 'pin' || S.view === 'setpin') && !e.target.closest('input')){
    if (/^\d$/.test(e.key)) onDigit(e.key);
    else if (e.key === 'Backspace') onDel();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){ S.hiddenAt = Date.now(); return; }
  if (!S.user || !S.hiddenAt) return;
  if (Date.now() - S.hiddenAt > AUTO_LOCK_MS) lockApp();
  else if (S.view === 'main') loadData(false).then(ok => { if (ok && S.view === 'main' && !S.sheet) rerenderContent(); });
});

/* =====================================================================
   INDÍTÁS
   ===================================================================== */
$('#wm').innerHTML = `<img src="${LOGO_URL}" alt="">`;
if (LIVE_BUILD && !API.remote){
  $('#app').innerHTML = `<main class="auth"><div class="crest">${logo(92, SCHOOL_DEFAULT + ' logó')}</div><h1>BüféApp</h1><p class="school">${esc(SCHOOL_DEFAULT)}</p><p class="notice" role="alert">Az app még nincs összekötve az iskola adatbázisával. Hamarosan elérhető.</p></main>`;
} else {
  S.device = store.get(DEVKEY, null);
  S.view = S.device && S.device.hash ? 'pin' : 'login';
  render();
}

})();
</script>
